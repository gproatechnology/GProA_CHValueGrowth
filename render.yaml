services:
  - type: web
    name: chvaluegrowth-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: python -m uvicorn services.api.main:app --host 0.0.0.0 --port 10000
    autoDeploy: true
    branch: SubMain
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: DATABASE_URL
        value: sqlite:///chvaluegrowth.db
      - key: JWT_SECRET
        value: chvalue2026_secret_key_change_in_production
      - key: MOCK_MODE
        value: "true"
      - key: RENDER
        value: "true"