# ============================================================
# CHValueGrowth - Sprint Planning & Tracking
# ============================================================
# Version: 2.0.0
# Last Updated: 2026-04-06
# Methodology: Agile (2-week sprints)
# Repository: GProA_CHValueGrowth
# ============================================================

project:
  name: CHValueGrowth
  full_name: CHValueGrowth - Análisis de Valor de Llantas
  version: 2.0.0
  repository: https://github.com/GProA/CHValueGrowth
  project_manager: GProA Development Team
  product_owner: CHValueGrowth Stakeholders
  
  description: |
    Plataforma de scraping y análisis de precios de llantas en MercadoLibre.
    Proporciona API RESTful, pipeline de datos ETL, y dashboard visual.
  
  tech_stack:
    backend:
      - FastAPI 0.104+
      - Python 3.11+
      - SQLAlchemy 2.0+
    database:
      - SQLite (development)
      - PostgreSQL (production)
    scraping:
      - BeautifulSoup4
      - Requests
      - Asyncio
    frontend:
      - React 18+
      - Vite
      - TailwindCSS
    deployment:
      - Docker
      - Render/Railway

# ============================================================
# Global Rules
# ============================================================
rules:
  - id: rule_1
    rule: "No romper estructura existente"
    severity: critical
    enforcement: automated_ci
  
  - id: rule_2
    rule: "No eliminar archivos sin justificación documentada"
    severity: high
    enforcement: pr_review
  
  - id: rule_3
    rule: "Mantener compatibilidad con FastAPI y React"
    severity: high
    enforcement: integration_tests
  
  - id: rule_4
    rule: "Documentar TODO lo que se cambie en CHANGELOG.md"
    severity: mandatory
    enforcement: pr_template
  
  - id: rule_5
    rule: "Código debe ser ejecutable y pasar pruebas unitarias"
    severity: critical
    enforcement: ci_pipeline

# ============================================================
# Global Constraints
# ============================================================
global_constraints:
  - constraint: "No refactorizar todo el proyecto sin aprobación"
    reason: "Mantener estabilidad del sistema"
    exception_process: "Requiere approval del Project Manager"
  
  - constraint: "Cambios mínimos y controlados por sprint"
    reason: "Evitar technical debt y conflictos"
    max_files_per_pr: 15
  
  - constraint: "No agregar nuevas dependencias sin justificar"
    reason: "Control de vulnerabilidades y tamaño"
    process: "Justificar en PR y documentar en DEPENDENCIES.md"
  
  - constraint: "Mantener cobertura de pruebas >70%"
    reason: "Calidad y mantenibilidad"
    current_coverage: 75%

# ============================================================
# Sprint Configuration
# ============================================================
sprint_config:
  duration_weeks: 2
  review_day: "Friday"
  planning_day: "Monday"
  timezone: "America/Mexico_City"
  daily_standup: "10:00 AM"
  
  metrics:
    - velocity_points
    - completion_rate
    - bug_rate
    - test_coverage

